<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>document.documentElement.classList.add("js");try{var t=localStorage.getItem("speakease-site-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <title>SpeakEase - Type less, speak more</title>
  <meta name="description" content="Vietnamese-first dictation for the Mac. Press ⌥ Space, speak, press it again, and the text lands where the cursor is, in any app. Recognised on your Mac, with AI cleanup and translation. Free for personal use.">
  <meta property="og:title" content="SpeakEase - Type less, speak more">
  <meta property="og:description" content="Press the shortcut, speak, press it again: the text lands where the cursor is. Free for your Mac.">
  <meta property="og:image" content="https://wblekhoa.github.io/speakease/screenshots/en-speak.png">
  <meta property="og:type" content="website">
  <link rel="icon" href="../icon.svg" type="image/svg+xml" vite-ignore>
  <link rel="alternate" hreflang="vi" href="../" vite-ignore>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap">
  <script type="module" src="/site.js"></script>
</head>

</body>
</html>
