<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8DB8"/>
      <stop offset="0.55" stop-color="#F0447F"/>
      <stop offset="1" stop-color="#C2185B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0447F"/>
      <stop offset="1" stop-color="#C2185B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#5a0a2b" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7a0c38" flood-opacity="0.30"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  </g>
  <!-- speech bubble -->
  <g filter="url(#soft)">
    <path d="M318 268 H706 A112 112 0 0 1 818 380 V594 A112 112 0 0 1 706 706 H470 L346 792 C334 800 318 791 320 777 L330 706 H318 A112 112 0 0 1 206 594 V380 A112 112 0 0 1 318 268 Z" fill="#ffffff"/>
  </g>
  <!-- waveform -->
  <g fill="url(#bar)">
    <rect x="322" y="446" width="44" height="82" rx="22"/>
    <rect x="400" y="392" width="44" height="190" rx="22"/>
    <rect x="478" y="346" width="44" height="282" rx="22"/>
    <rect x="556" y="404" width="44" height="166" rx="22"/>
    <rect x="634" y="452" width="44" height="70" rx="22"/>
  </g>
</svg>
